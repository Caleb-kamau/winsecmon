# winsecmon configuration
#
# Copy this file to winsecmon.toml (or run `winsecmon init-config winsecmon.toml`)
# and edit it. Settings you omit fall back to the values shown here.
#
# Config lookup order: --config FILE, %WINSECMON_CONFIG%, .\winsecmon.toml,
# %APPDATA%\winsecmon\winsecmon.toml, then these built-in defaults.
#
# This file only controls what is READ and how it is displayed. winsecmon never
# changes audit policy, never clears logs and never sends data anywhere.

[general]
log_name = "Security"            # channel to read
backend = "wevtutil"             # "wevtutil" (built in) or "powershell" (Get-WinEvent)
default_lookback = "24h"         # used when no --since/--start is given (live log only)
max_events = 5000                # upper bound on events read per run (1 - 200000)
query_timeout_seconds = 120      # give up on a single Windows query after this long
display_timezone = "local"       # "local" or "utc" (exports are always UTC)

[filters]
# Accounts to hide by default (case-insensitive, * and ? wildcards). Matched against
# the account an event is primarily about. Pass --no-exclude to show them anyway.
# The number of hidden events is always reported.
exclude_users = ["DWM-*", "UMFD-*"]

[summary]
top_n = 10                       # rows in "top accounts / computers / sources"
failed_logon_threshold = 5       # failed logons from one account or address that get highlighted

[report]
title = "Windows Security Event Report"
max_events_shown = 200           # newest events listed in the HTML report

# ---------------------------------------------------------------------------
# Monitored events. If you define [[events]] in your own file, your list
# REPLACES this one entirely. Set enabled = false to keep an entry but skip it.
# severity: info | low | medium | high | critical
# Windows does not assign severities to Security events; these are triage
# hints chosen here, so change them to match your environment.
# ---------------------------------------------------------------------------

# --- Authentication -------------------------------------------------------
[[events]]
id = 4624
name = "Successful logon"
category = "authentication"
severity = "info"
description = "An account logged on successfully."

[[events]]
id = 4625
name = "Failed logon"
category = "authentication"
severity = "medium"
description = "An account failed to log on."

[[events]]
id = 4648
name = "Logon with explicit credentials"
category = "authentication"
severity = "low"
description = "A process logged on using explicitly supplied credentials (runas, scheduled tasks, lateral movement tools)."

[[events]]
id = 4740
name = "Account locked out"
category = "authentication"
severity = "high"
description = "A user account was locked out."

[[events]]
id = 4767
name = "Account unlocked"
category = "authentication"
severity = "low"
description = "A user account was unlocked."

[[events]]
id = 4776
name = "NTLM credential validation"
category = "authentication"
severity = "low"
enabled = false                  # mostly useful on domain controllers; noisy
description = "The computer attempted to validate credentials for an account (NTLM)."

[[events]]
id = 4634
name = "Logoff"
category = "authentication"
severity = "info"
enabled = false                  # very noisy
description = "An account was logged off."

