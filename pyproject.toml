[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winsecmon"
version = "0.1.0"
description = "Read-only local monitoring of the Windows Security event log"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only, on purpose

[project.scripts]
winsecmon = "winsecmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
winsecmon = ["default_config.toml"]
